<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes page responsive on mobile -->
  <title>Search Charity Events</title> 
  <link rel="stylesheet" href="../css/styles.css"> <!-- Link to external styling file -->
</head>
<body>
  <!-- Header section with navigation and page title -->
  <header>
    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li> 
        <li><a href="search.html">Search Events</a></li> 
      </ul>
      <h1>Search Charity Events</h1> 
    </nav>
  </header>
  <!-- Main content area with search functionality -->
  <main>
    <!-- Search form with event filters -->
    <form id="searchForm">
      <div class="form-group">
        <label for="date">Event Date:</label>
        <input type="date" id="date" name="date"> 
      </div>
      <div class="form-group">
        <label for="location">Location:</label>
        <select id="location" name="locationId">
          <!-- Location options will be populated dynamically -->
        </select> 
      </div>
      <div class="form-group">
        <label for="category">Category:</label>
        <select id="category" name="categoryId">
          <!-- Category options will be populated dynamically -->
        </select> 
      </div>
      <div class="form-group button-group">
        <button type="submit" class="action-btn">Search</button> 
        <button type="button" id="clearFilters" class="action-btn clear">Clear Filters</button> 
      </div>
    </form>

    <div id="searchResults">Select filters and search</div> 
    <div id="searchError" class="error" style="display: none;"></div> 
  </main>

  <!-- Footer with copyright info -->
  <footer>
    <p>&copy; 2025 Charity Event Hub</p> 
  </footer>

  <script src="../js/search.js" defer></script>
</body>
</html>
