<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Events</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="search.html">Search Events</a></li>
      </ul>
    </nav>
    <h1>Search Events</h1>
  </header>

  <main>
    <section class="search-filters">
      <form id="searchForm">
        <div class="form-group">
          <label for="eventDate">Event Date:</label>
          <input type="date" id="eventDate" name="eventDate">
        </div>
        <div class="form-group">
          <label for="location">Location:</label>
          <select id="location" name="location">
            <option value="">All Locations</option>
            <option value="1">Liuzhou</option>
            <option value="2">Guangxi</option>
            <option value="3">Nanning</option>
          </select>
        </div>
        <div class="form-group">
          <label for="category">Category:</label>
          <select id="category" name="category">
            <option value="">All Categories</option>
            <option value="1">Marathon</option>
            <option value="2">Gala</option>
            <option value="3">Auction</option>
            <option value="4">Concert</option>
          </select>
        </div>
        <button type="button" id="clearFilters">Clear Filters</button>
        <button type="submit">Search Events</button>
      </form>
    </section>

    <section class="search-results">
      <h2>Search Results</h2>
      <div id="searchResults" class="event-list">
        <p>Select filters and search</p>
      </div>
      <div id="searchError" class="error" style="display: none;"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Charity Event Hub</p>
  </footer>

  <script src="js/search.js"></script>
</body>
</html>
